<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calcular Valor Factura</title>
</head>
<body>

    <h1>Calcular Valor Factura</h1>

    <form action="/valorfactura" method="POST">

        <label>NIT del cliente:</label>
        <input type="text" name="nit" required>
        <br><br>

        <label>Número de servicios:</label>
        <input type="number" name="numero_servicios" min="1" required>
        <br><br>

        <label>Precio de cada sensor:</label>
        <input type="number" name="precio_sensor" min="0.01" step="0.01" required>
        <br><br>

        <button type="submit">Calcular Factura</button>

    </form>

</body>
</html>
